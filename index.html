<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZeroHunger Login</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1f8a70, #2c3e50);
        color: #1c1c1c;
      }

      .login-card {
        width: min(420px, 92vw);
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(6px);
        border-radius: 18px;
        padding: 42px 38px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.2);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 26px;
      }

      .brand-logo {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(135deg, #ffbe0b, #fb5607);
        color: #fff;
        font-size: 1.4rem;
        font-weight: 700;
      }

      h1 {
        font-size: 1.85rem;
        margin: 0;
        color: #102a43;
      }

      p.subtitle {
        margin: 0 0 28px;
        color: #4f5d75;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 22px;
      }

      label {
        font-weight: 600;
        color: #2f3e46;
      }

      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid rgba(47, 62, 70, 0.2);
        font-size: 1rem;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input[type="email"]:focus,
      input[type="password"]:focus {
        outline: none;
        border-color: #1f8a70;
        box-shadow: 0 0 0 3px rgba(31, 138, 112, 0.18);
      }

      .options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 26px;
        font-size: 0.95rem;
      }

      .options a {
        color: #1f8a70;
        text-decoration: none;
        font-weight: 600;
      }

      .options a:hover {
        text-decoration: underline;
      }

      .remember {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #4f5d75;
      }

      button[type="submit"] {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #1f8a70, #168aad);
        color: #fff;
        font-size: 1.05rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button[type="submit"]:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 20px rgba(22, 138, 173, 0.25);
      }

      .signup {
        margin-top: 26px;
        text-align: center;
        font-size: 0.98rem;
        color: #4f5d75;
      }

      .signup a {
        color: #ff7b00;
        font-weight: 600;
        text-decoration: none;
      }

      .signup a:hover {
        text-decoration: underline;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: radial-gradient(circle at top, #1f8a70, #0b1d2e 60%);
          color: #f1f5f8;
        }

        .login-card {
          background: rgba(15, 23, 42, 0.82);
          color: #e2e8f0;
          border: 1px solid rgba(226, 232, 240, 0.1);
        }

        h1 {
          color: #e2e8f0;
        }

        label {
          color: #e2e8f0;
        }

        input[type="email"],
        input[type="password"] {
          background: rgba(15, 23, 42, 0.75);
          border-color: rgba(148, 163, 184, 0.3);
          color: #e2e8f0;
        }

        .remember {
          color: #cbd5f5;
        }

        .signup {
          color: #cbd5f5;
        }
      }
    </style>
  </head>
  <body>
    <main class="login-card" aria-labelledby="login-title">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">ZH</span>
        <h1 id="login-title">ZeroHunger Login</h1>
      </div>
      <p class="subtitle">
        Sign in to coordinate community meals, manage resources, and continue
        nourishing our neighbors.
      </p>
      <form>
        <div class="input-group">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </div>
        <div class="options">
          <label class="remember">
            <input type="checkbox" name="remember" />
            Remember me
          </label>
          <a href="#">Forgot password?</a>
        </div>
        <button type="submit">Sign in</button>
      </form>
      <p class="signup">
        New to ZeroHunger?
        <a href="#">Create an account</a>
      </p>
    </main>
  </body>
</html>
